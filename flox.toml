# flox.toml - vers-agent reproducible deployment environment
# Run: flox activate
# Provides: bun, claude-code, ngrok, sqlite, jq, curl

version = 1

[install]
# Bun runtime (primary execution environment)
bun.pkg-path = "bun"

# System utilities
curl.pkg-path = "curl"
jq.pkg-path = "jq"
sqlite.pkg-path = "sqlite"

# ngrok for tunnel (binary install handled in activation)
# Claude Code (binary install handled in activation)

[hook]
on-activate = '''
  # Set up vers-agent environment
  export VERS_AGENT_HOME="${HOME}/.vers-agent"
  export CLAUDE_CODE_EXECUTABLE="${HOME}/.local/bin/claude-code"
  
  # Create directories
  mkdir -p "${VERS_AGENT_HOME}/logs"
  mkdir -p "${HOME}/.local/bin"
  mkdir -p "${HOME}/.claude"
  
  # Install Claude Code if not present
  if [ ! -f "${CLAUDE_CODE_EXECUTABLE}" ]; then
    echo "Installing Claude Code..."
    curl -fsSL https://storage.googleapis.com/anthropic-releases/claude-code/latest/claude-code-$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m) \
      -o "${CLAUDE_CODE_EXECUTABLE}" && chmod +x "${CLAUDE_CODE_EXECUTABLE}"
  fi
  
  # Install ngrok if not present
  if ! command -v ngrok >/dev/null 2>&1; then
    echo "Installing ngrok..."
    NGROK_ARCH="$(uname -m)"
    NGROK_OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
    if [ "$NGROK_ARCH" = "x86_64" ]; then NGROK_ARCH="amd64"; fi
    if [ "$NGROK_ARCH" = "aarch64" ]; then NGROK_ARCH="arm64"; fi
    
    curl -fsSL "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-${NGROK_OS}-${NGROK_ARCH}.tgz" \
      | tar xz -C "${HOME}/.local/bin"
  fi
  
  # Add local bin to PATH if not already there
  case ":$PATH:" in
    *":${HOME}/.local/bin:"*) ;;
    *) export PATH="${HOME}/.local/bin:$PATH" ;;
  esac
  
  # Source ~/.topos/.env if available (for NGROK_AUTHTOKEN, ANTHROPIC_API_KEY)
  if [ -f "${HOME}/.topos/.env" ]; then
    set -a
    . "${HOME}/.topos/.env"
    set +a
  fi
  
  echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
  echo "vers-agent environment activated | #c778ea"
  echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
  echo "Bun:         $(bun --version)"
  echo "Claude Code: $(${CLAUDE_CODE_EXECUTABLE} --version 2>/dev/null || echo 'not found')"
  echo "ngrok:       $(ngrok version 2>/dev/null | head -1 || echo 'not found')"
  echo "NGROK_AUTHTOKEN: $([ -n "$NGROK_AUTHTOKEN" ] && echo 'set' || echo 'not set')"
  echo "ANTHROPIC_API_KEY: $([ -n "$ANTHROPIC_API_KEY" ] && echo 'set' || echo 'not set')"
  echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
'''

[vars]
# Default configuration (can be overridden by ~/.topos/.env)
PORT = "9999"
NODE_ENV = "production"
VERS_DEBUG = "false"

[profile.development]
[profile.development.vars]
NODE_ENV = "development"
VERS_DEBUG = "true"

[profile.production]
[profile.production.vars]
NODE_ENV = "production"
VERS_DEBUG = "false"
