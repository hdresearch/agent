name: Deploy Preview via ngrok

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          
      - name: Install dependencies
        run: bun install
        
      - name: Install ngrok
        run: |
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc \
            | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" \
            | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update && sudo apt-get install ngrok
          
      - name: Configure ngrok
        run: ngrok config add-authtoken $NGROK_AUTHTOKEN
        
      - name: Build
        run: bun run build
        
      - name: Start server
        run: |
          ./vers-agent --server --port 8765 &
          sleep 3
          
      - name: Start tunnel
        run: |
          ngrok http 8765 --traffic-policy-file=src/tunnel/policy.yml &
          sleep 5
          
      - name: Get tunnel URL
        id: tunnel
        run: |
          URL=$(curl -s http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[0].public_url')
          echo "url=$URL" >> $GITHUB_OUTPUT
          
      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.tunnel.outputs.url }}';
            const body = `## 🚇 Preview Deployment
            
            **URL:** ${url}
            
            **Test with:**
            \`\`\`bash
            vers-agent --remote ${url}
            \`\`\`
            
            **Or add to Claude:**
            Settings → Integrations → Add: \`${url}\`
            
            ⏱️ Preview expires in ~25 minutes`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
            
      - name: Keep alive for preview
        run: sleep 1500  # 25 minutes
