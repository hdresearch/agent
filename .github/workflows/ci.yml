name: CI

on:
  push:
    branches: [main, just-just]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: just install

      - name: Typecheck
        run: just typecheck

      - name: Run tests (unit + component)
        run: just test

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: vers-agent-linux-x64
            can_test: true
          - os: ubuntu-latest
            target: bun-linux-arm64
            artifact: vers-agent-linux-arm64
            can_test: false  # Cross-compiled, can't test on x64 runner
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: vers-agent-darwin-arm64
            can_test: true
          - os: macos-latest
            target: bun-darwin-x64
            artifact: vers-agent-darwin-x64
            can_test: false  # Cross-compiled, can't test on ARM runner
          - os: windows-latest
            target: bun-windows-x64
            artifact: vers-agent-windows-x64.exe
            can_test: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME:-nightly}"
          SHA="${GITHUB_SHA::7}"
          bun build --compile --minify --external cpu-features --target=${{ matrix.target }} \
            --define "BUILD_VERSION='$VERSION ($SHA)'" \
            ./index.ts --outfile ${{ matrix.artifact }}

      - name: Test binary
        if: matrix.can_test
        shell: bash
        run: ./${{ matrix.artifact }} --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 90

      - name: Upload to R2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ryand56/r2-upload-action@latest
        with:
          r2-account-id: ${{ secrets.CF_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.CF_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.CF_SECRET_ACCESS_KEY }}
          r2-bucket: vers-releases
          source-dir: .
          destination-dir: nightly
          glob: ${{ matrix.artifact }}

  nightly:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            cp "$dir"* release/ 2>/dev/null || true
          done
          ls -la release/

      - name: Update nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          body: |
            Automated nightly build from main branch.

            **Commit:** ${{ github.sha }}
            **Date:** ${{ github.event.head_commit.timestamp }}

            These binaries are built automatically and may be unstable.
          prerelease: true
          files: release/*
          fail_on_unmatched_files: false

  nix:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            sandbox = false

      - name: Check flake
        run: nix flake check

      - name: Build with Nix
        run: nix build

      - name: Test Nix build
        run: ./result/bin/vers-agent --help
