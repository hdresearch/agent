name: CI

on:
  push:
    branches: [main, just-just]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: just install

      - name: Typecheck
        run: just typecheck

      - name: Run tests (unit + component)
        run: just test

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: vers-agent-linux-x64
            can_test: true
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: vers-agent-darwin-arm64
            can_test: true
          - os: macos-latest
            target: bun-darwin-x64
            artifact: vers-agent-darwin-x64
            can_test: false  # Cross-compiled, can't test on ARM runner
          - os: windows-latest
            target: bun-windows-x64
            artifact: vers-agent-windows-x64.exe
            can_test: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun build --compile --minify --external cpu-features --target=${{ matrix.target }} ./index.ts --outfile ${{ matrix.artifact }}

      - name: Test binary
        if: matrix.can_test
        shell: bash
        run: ./${{ matrix.artifact }} --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
