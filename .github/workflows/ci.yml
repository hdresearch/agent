name: CI

on:
  push:
    branches: [main, just-just]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: just install

      - name: Typecheck
        run: just typecheck

      - name: Run tests (unit + component)
        run: just test

      - name: Build
        run: just build

  docker-tests:
    if: false  # Disabled for now
    runs-on: ubuntu-latest
    needs: test  # Run after unit tests pass

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        run: docker compose -f docker-compose.test.yml build

      - name: Start server container
        run: docker compose -f docker-compose.test.yml up -d

      - name: Wait for server to be healthy
        run: |
          echo "Waiting for server to be healthy..."
          timeout 120 bash -c 'until docker compose -f docker-compose.test.yml ps | grep -q healthy; do
            echo "Still waiting..."
            docker compose -f docker-compose.test.yml logs --tail=10
            sleep 5
          done'
          echo "Server is healthy!"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build CLI for testing
        run: bun run build

      - name: Run Docker server tests
        run: bun test tests/docker/server-remote.test.ts tests/docker/server-persistence.test.ts
        env:
          DOCKER_SERVER_URL: http://localhost:19999

      - name: Run VT integration tests
        run: bun test tests/docker/vt-integration.test.ts
        env:
          DOCKER_SERVER_URL: http://localhost:19999

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
