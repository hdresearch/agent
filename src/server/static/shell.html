<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vers shell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --bg-elevated: #fafafa;
      --border: #002fff;
      --border-dim: #e0e0e0;
      --text: #002fff;
      --text-dim: #666666;
      --accent: #002fff;
      --accent-hover: #0040ff;
      --success: #00aa55;
      --error: #cc0000;
      --warning: #cc8800;
      --invert-text: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --bg-elevated: #0a0a0a;
        --border: #ffffff;
        --border-dim: #333333;
        --text: #d5d5d5;
        --text-dim: #888888;
        --accent: #f6d000;
        --accent-hover: #ffdd33;
        --success: #00ff88;
        --error: #ff4444;
        --warning: #ffaa00;
        --invert-text: #000000;
      }
    }

    html.light {
      --bg: #ffffff;
      --bg-elevated: #fafafa;
      --border: #002fff;
      --border-dim: #e0e0e0;
      --text: #002fff;
      --text-dim: #666666;
      --accent: #002fff;
      --accent-hover: #0040ff;
      --success: #00aa55;
      --error: #cc0000;
      --warning: #cc8800;
      --invert-text: #ffffff;
    }

    html.dark {
      --bg: #000000;
      --bg-elevated: #0a0a0a;
      --border: #ffffff;
      --border-dim: #333333;
      --text: #d5d5d5;
      --text-dim: #888888;
      --accent: #f6d000;
      --accent-hover: #ffdd33;
      --success: #00ff88;
      --error: #ff4444;
      --warning: #ffaa00;
      --invert-text: #000000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Share Tech Mono', monospace;
      font-size: 14px;
      line-height: 1.6;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      letter-spacing: 0.02em;
    }

    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--bg);
      flex-shrink: 0;
    }

    .logo {
      font-size: 14px;
      letter-spacing: 0.1em;
      color: var(--accent);
    }

    .parent-link {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: color 0.2s;
    }

    .parent-link:hover { color: var(--text); }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-dim);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: var(--text-dim);
    }

    .status-dot.connected { background: var(--success); }
    .status-dot.busy { background: var(--accent); animation: pulse 1.5s infinite; }
    .status-dot.error { background: var(--error); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-link {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 11px;
      transition: color 0.2s;
    }

    .header-link:hover { color: var(--text); }

    .theme-btn {
      background: none;
      border: 1px solid var(--border-dim);
      color: var(--text-dim);
      font-family: inherit;
      font-size: 10px;
      padding: 3px 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .theme-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    /* Main content */
    .main {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
    }

    .main::-webkit-scrollbar { width: 4px; }
    .main::-webkit-scrollbar-track { background: var(--bg); }
    .main::-webkit-scrollbar-thumb { background: var(--border-dim); }

    /* Messages */
    .message {
      margin-bottom: 14px;
      white-space: pre-wrap;
      word-wrap: break-word;
      animation: fadeIn 0.15s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-text { color: var(--text); }
    .message-system { color: var(--text-dim); font-size: 12px; }
    .message-user {
      color: var(--accent);
      padding-left: 14px;
      border-left: 2px solid var(--accent);
    }

    .message-error {
      color: var(--error);
      padding: 10px 14px;
      border: 1px solid var(--error);
    }

    /* Tool blocks */
    .tool-block {
      border: 1px solid var(--border-dim);
      margin: 14px 0;
    }

    .tool-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-dim);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
    }

    .tool-header.running { border-left: 2px solid var(--accent); }
    .tool-header.success { border-left: 2px solid var(--success); }
    .tool-header.error { border-left: 2px solid var(--error); }

    .tool-name { color: var(--text); }
    .tool-status { margin-left: auto; font-size: 10px; }

    .tool-content {
      padding: 10px 14px;
      font-size: 12px;
      color: var(--text-dim);
      max-height: 180px;
      overflow-y: auto;
    }

    /* Stats */
    .stats {
      display: flex;
      gap: 14px;
      padding: 10px 14px;
      border: 1px solid var(--border-dim);
      font-size: 11px;
      color: var(--text-dim);
      margin: 14px 0;
    }

    .stat { display: flex; gap: 5px; }
    .stat-value { color: var(--text); }

    /* Permission */
    .permission {
      border: 1px solid var(--warning);
      margin: 14px 0;
    }

    .permission-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--warning);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--warning);
    }

    .permission-content { padding: 14px; }
    .permission-tool { color: var(--text); margin-bottom: 12px; }
    .permission-actions { display: flex; gap: 10px; }

    .permission-btn {
      padding: 6px 14px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: 11px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }

    .permission-btn:hover {
      background: var(--text);
      color: var(--bg);
    }

    .permission-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--invert-text);
    }

    .permission-btn.primary:hover { background: var(--accent-hover); }

    /* Typing indicator */
    .typing {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-dim);
      font-size: 11px;
      margin: 14px 0;
    }

    .typing-dots { display: flex; gap: 3px; }

    .typing-dots span {
      width: 4px;
      height: 4px;
      background: var(--accent);
      animation: typing 1.4s infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing {
      0%, 60%, 100% { opacity: 0.3; }
      30% { opacity: 1; }
    }

    /* Empty state */
    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-dim);
      text-align: center;
    }

    .empty h2 {
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 0.1em;
      margin-bottom: 6px;
      color: var(--accent);
    }

    .empty p { font-size: 12px; }

    /* Children bar */
    .children-bar {
      border-top: 1px solid var(--border-dim);
      padding: 10px 24px;
      background: var(--bg-elevated);
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 11px;
      flex-shrink: 0;
    }

    .children-label { color: var(--text-dim); }

    .child-link {
      color: var(--text);
      text-decoration: none;
      padding: 3px 8px;
      border: 1px solid var(--border-dim);
      transition: all 0.2s;
    }

    .child-link:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Child VM status colors */
    .child-link.starting { border-color: var(--text-dim); opacity: 0.7; }
    .child-link.ready { border-color: var(--success); }
    .child-link.busy,
    .child-link.running { border-color: var(--accent); }
    .child-link.done,
    .child-link.completed { border-color: var(--success); color: var(--success); }
    .child-link.failed,
    .child-link.error { border-color: var(--error); color: var(--error); }
    .child-link.stopping { border-color: var(--warning); opacity: 0.7; }
    .child-link.stopped { border-color: var(--text-dim); opacity: 0.5; }

    .branch-btn {
      color: var(--text-dim);
      text-decoration: none;
      padding: 3px 8px;
      border: 1px dashed var(--border-dim);
      transition: all 0.2s;
    }

    .branch-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      border-style: solid;
    }

    /* Input area */
    .input-area {
      border-top: 1px solid var(--border);
      padding: 14px 24px;
      background: var(--bg);
      flex-shrink: 0;
    }

    .input-form { display: flex; gap: 10px; }

    .input-field {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--border-dim);
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-field:focus { border-color: var(--accent); }
    .input-field:disabled { opacity: 0.5; }
    .input-field::placeholder { color: var(--text-dim); }

    .send-btn {
      padding: 10px 20px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: var(--invert-text);
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }

    .send-btn:hover { background: var(--accent-hover); }
    .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Split layout */
    .split-container {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .split-container.sidebar-closed .tree-sidebar { display: none; }
    .split-container.sidebar-closed .shell-content { width: 100%; }

    /* Tree sidebar */
    .tree-sidebar {
      width: 280px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    .tree-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-dim);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tree-header-title { color: var(--accent); }

    .tree-count {
      font-size: 10px;
      color: var(--text-dim);
    }

    .tree-content {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .tree-content::-webkit-scrollbar { width: 4px; }
    .tree-content::-webkit-scrollbar-track { background: var(--bg); }
    .tree-content::-webkit-scrollbar-thumb { background: var(--border-dim); }

    /* Tree nodes */
    .tree-node {
      padding: 6px 14px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text);
    }

    .tree-node:hover { background: var(--bg-elevated); }
    .tree-node.current { background: var(--bg-elevated); border-left: 2px solid var(--accent); }

    .tree-node-prefix {
      color: var(--text-dim);
      font-size: 11px;
      white-space: pre;
    }

    .tree-node-icon { font-size: 10px; }
    .tree-node-icon.starting { color: var(--text-dim); }
    .tree-node-icon.ready { color: var(--success); }
    .tree-node-icon.busy { color: var(--accent); }
    .tree-node-icon.completed { color: var(--success); }
    .tree-node-icon.failed { color: var(--error); }

    .tree-node-id {
      font-weight: bold;
      color: var(--text);
    }

    .tree-node.current .tree-node-id { color: var(--accent); }

    .tree-node-task {
      color: var(--text-dim);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .tree-node-status {
      font-size: 10px;
      color: var(--text-dim);
      margin-left: auto;
    }

    .tree-empty {
      padding: 14px;
      color: var(--text-dim);
      font-size: 12px;
      text-align: center;
    }

    /* Shell content area */
    .shell-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Toggle button */
    .sidebar-toggle {
      background: none;
      border: 1px solid var(--border-dim);
      color: var(--text-dim);
      font-family: inherit;
      font-size: 10px;
      padding: 3px 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .sidebar-toggle:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .sidebar-toggle.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Mobile responsive - vertical split (tree on top, shell on bottom) */
    @media (max-width: 768px) {
      .split-container {
        flex-direction: column;
      }

      .tree-sidebar {
        width: 100%;
        height: 35vh;
        min-height: 120px;
        max-height: 200px;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }

      .split-container.sidebar-closed .tree-sidebar {
        display: none;
      }

      .shell-content {
        flex: 1;
        min-height: 0;
      }

      .header {
        padding: 10px 16px;
        flex-wrap: wrap;
        gap: 8px;
      }

      .header-right {
        order: -1;
        width: 100%;
        justify-content: flex-end;
        margin-left: 0;
      }

      .main {
        padding: 14px 16px;
      }

      .children-bar {
        padding: 8px 16px;
        flex-wrap: wrap;
      }

      .input-area {
        padding: 10px 16px;
      }

      .tree-node {
        padding: 8px 12px;
      }

      .tree-content {
        padding: 4px 0;
      }
    }

    /* Very small screens */
    @media (max-width: 480px) {
      .tree-sidebar {
        height: 30vh;
        max-height: 160px;
      }

      .logo {
        font-size: 12px;
      }

      .tree-node-task {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { h, render } from 'https://esm.sh/preact@10.19.3';
    import { useState, useEffect, useRef } from 'https://esm.sh/preact@10.19.3/hooks';
    import htm from 'https://esm.sh/htm@3.1.1';

    const html = htm.bind(h);

    // Get auth token from URL
    const urlParams = new URLSearchParams(window.location.search);
    const authToken = urlParams.get('token');

    // Theme management
    function getTheme() {
      return localStorage.getItem('vers-theme') || 'system';
    }

    function applyTheme(theme) {
      document.documentElement.classList.remove('light', 'dark');
      if (theme !== 'system') {
        document.documentElement.classList.add(theme);
      }
    }

    function cycleTheme() {
      const current = getTheme();
      const next = current === 'system' ? 'light' : current === 'light' ? 'dark' : 'system';
      localStorage.setItem('vers-theme', next);
      applyTheme(next);
      return next;
    }

    applyTheme(getTheme());

    // RPC helper
    async function rpc(method, params = {}) {
      const headers = { 'Content-Type': 'application/json' };
      if (authToken) headers['Authorization'] = `Bearer ${authToken}`;

      const res = await fetch('/rpc', {
        method: 'POST',
        headers,
        body: JSON.stringify({ jsonrpc: '2.0', id: Date.now(), method, params }),
      });

      const data = await res.json();
      if (data.error) throw new Error(data.error.message);
      return data.result;
    }

    // Escape HTML
    function esc(s) {
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    // Map VM event types to status strings
    function mapEventTypeToStatus(eventType, currentStatus, event) {
      // Event types from the VM events stream
      switch (eventType) {
        case 'vm_started':
        case 'started':
          return 'ready';
        case 'vm_stopping':
        case 'stopping':
          return 'stopping';
        case 'vm_stopped':
        case 'stopped':
          return 'stopped';
        case 'vm_error':
        case 'error':
          return 'failed';
        case 'tool_call':
        case 'content_chunk':
        case 'working':
          return 'busy';
        case 'turn_complete':
        case 'idle':
          return 'ready';
        default:
          // If we get a status field directly in the event, use it
          return event?.status || currentStatus;
      }
    }

    // Build tree structure from flat VM list
    function buildTreeFromVms(vms, currentVmId) {
      const nodeMap = new Map();
      const roots = [];

      // First pass: create all nodes
      for (const vm of vms) {
        nodeMap.set(vm.vmId, {
          ...vm,
          children: [],
          isCurrent: vm.vmId === currentVmId,
        });
      }

      // Second pass: build parent-child relationships
      for (const vm of vms) {
        const node = nodeMap.get(vm.vmId);
        if (vm.parent && nodeMap.has(vm.parent)) {
          nodeMap.get(vm.parent).children.push(node);
        } else {
          roots.push(node);
        }
      }

      // Sort children by creation time
      function sortChildren(node) {
        node.children.sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
        node.children.forEach(sortChildren);
      }
      roots.forEach(sortChildren);

      return { roots, nodeMap, total: vms.length };
    }

    // Components
    function TreeSidebar({ tree, currentVmId }) {
      if (!tree || tree.total === 0) {
        return html`
          <div class="tree-sidebar">
            <div class="tree-header">
              <span class="tree-header-title">tree</span>
            </div>
            <div class="tree-empty">no VMs</div>
          </div>
        `;
      }

      const statusIcon = (status) => {
        switch (status) {
          case 'starting': return '◔';
          case 'ready': return '●';
          case 'busy': return '◐';
          case 'completed': return '✓';
          case 'failed': return '✗';
          default: return '○';
        }
      };

      // Render a node and its children recursively
      function renderNode(node, depth = 0, isLast = true, prefix = '') {
        const indent = depth === 0 ? '' : prefix + (isLast ? '└─' : '├─');
        const childPrefix = depth === 0 ? '' : prefix + (isLast ? '  ' : '│ ');
        const url = `https://${node.vmId}.vm.vers.sh/shell`;

        return html`
          <a
            key=${node.vmId}
            class="tree-node ${node.isCurrent ? 'current' : ''}"
            href=${url}
            title="${node.task || node.approach || node.status}"
          >
            <span class="tree-node-prefix">${indent}</span>
            <span class="tree-node-icon ${node.status}">${statusIcon(node.status)}</span>
            <span class="tree-node-id">${node.vmId.slice(0, 8)}</span>
            ${node.task && html`<span class="tree-node-task">${node.task.slice(0, 20)}</span>`}
          </a>
          ${node.children.map((child, idx) =>
            renderNode(child, depth + 1, idx === node.children.length - 1, childPrefix)
          )}
        `;
      }

      return html`
        <div class="tree-sidebar">
          <div class="tree-header">
            <span class="tree-header-title">tree</span>
            <span class="tree-count">${tree.total} VMs</span>
          </div>
          <div class="tree-content">
            ${tree.roots.map((root, idx) =>
              renderNode(root, 0, idx === tree.roots.length - 1, '')
            )}
          </div>
        </div>
      `;
    }

    function Header({ parent, status, statusText, onThemeToggle, sidebarOpen, onToggleSidebar }) {
      const vmId = window.location.hostname.split('.')[0];
      const parentUrl = parent ? `https://${parent}.vm.vers.sh/shell` : null;

      return html`
        <header class="header">
          <span class="logo">vers shell</span>
          ${parentUrl && html`
            <a class="parent-link" href=${parentUrl} target="_blank">
              ← ${parent.slice(0, 8)}
            </a>
          `}
          <div class="status">
            <div class="status-dot ${status}"></div>
            <span>${statusText}</span>
          </div>
          <div class="header-right">
            <button class="sidebar-toggle ${sidebarOpen ? 'active' : ''}" onClick=${onToggleSidebar}>
              ${sidebarOpen ? '◀ tree' : '▶ tree'}
            </button>
            <a class="header-link" href="/" target="_blank">app</a>
            <a class="header-link" href="/health" target="_blank">health</a>
            <button class="theme-btn" onClick=${onThemeToggle}>theme</button>
          </div>
        </header>
      `;
    }

    function ChildrenBar({ children, onBranch }) {
      if (!children || children.length === 0) {
        return html`
          <div class="children-bar">
            <span class="children-label">no children</span>
            <a class="branch-btn" href="#" onClick=${onBranch}>+ branch</a>
          </div>
        `;
      }

      // Status indicator mapping
      const statusIcon = (status) => {
        switch (status) {
          case 'starting': return '◔';
          case 'ready': return '●';
          case 'busy':
          case 'running': return '◐';
          case 'done':
          case 'completed': return '✓';
          case 'failed':
          case 'error': return '✗';
          case 'stopping': return '◑';
          case 'stopped': return '○';
          default: return '';
        }
      };

      return html`
        <div class="children-bar">
          <span class="children-label">children:</span>
          ${children.map(c => html`
            <a
              class="child-link ${c.status}"
              href="https://${c.vmId}.vm.vers.sh/shell"
              target="_blank"
              title="${c.task || c.approach || c.status}"
            >
              ${statusIcon(c.status)} ${c.vmId.slice(0, 8)}
            </a>
          `)}
          <a class="branch-btn" href="#" onClick=${onBranch}>+ branch</a>
        </div>
      `;
    }

    function Message({ type, content }) {
      return html`<div class="message message-${type}">${content}</div>`;
    }

    function ToolBlock({ id, name, title, status, content }) {
      return html`
        <div class="tool-block">
          <div class="tool-header ${status}">
            <span class="tool-name">${name}</span>
            ${title && title !== name && html`<span>${esc(title)}</span>`}
            <span class="tool-status">${status === 'running' ? 'running' : status === 'success' ? 'done' : 'failed'}</span>
          </div>
          ${content && html`<div class="tool-content">${content}</div>`}
        </div>
      `;
    }

    function Stats({ data }) {
      const stats = [];
      if (data.durationMs) stats.push({ l: 'time', v: (data.durationMs / 1000).toFixed(1) + 's' });
      if (data.inputTokens) stats.push({ l: 'in', v: data.inputTokens.toLocaleString() });
      if (data.outputTokens) stats.push({ l: 'out', v: data.outputTokens.toLocaleString() });
      if (data.totalCostUsd) stats.push({ l: 'cost', v: '$' + data.totalCostUsd.toFixed(4) });

      if (stats.length === 0) return null;

      return html`
        <div class="stats">
          ${stats.map(s => html`
            <div class="stat">
              <span>${s.l}</span>
              <span class="stat-value">${s.v}</span>
            </div>
          `)}
        </div>
      `;
    }

    function Permission({ id, toolCall, options, onRespond }) {
      const opts = options || [
        { id: 'allow', label: 'allow' },
        { id: 'deny', label: 'deny' },
      ];

      return html`
        <div class="permission">
          <div class="permission-header">permission required</div>
          <div class="permission-content">
            ${toolCall && html`<div class="permission-tool">${esc(toolCall.title || toolCall.toolName)}</div>`}
            <div class="permission-actions">
              ${opts.map(o => html`
                <button
                  class="permission-btn ${o.id === 'allow' || o.id === 'yes' ? 'primary' : ''}"
                  onClick=${() => onRespond(id, o.id)}
                >
                  ${o.label.toLowerCase()}
                </button>
              `)}
            </div>
          </div>
        </div>
      `;
    }

    function Typing() {
      return html`
        <div class="typing">
          <div class="typing-dots">
            <span></span><span></span><span></span>
          </div>
          <span>working</span>
        </div>
      `;
    }

    function Empty() {
      return html`
        <div class="empty">
          <h2>vers shell</h2>
          <p>autonomous infrastructure for agents</p>
        </div>
      `;
    }

    function InputArea({ disabled, onSubmit }) {
      const [value, setValue] = useState('');
      const inputRef = useRef(null);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!value.trim() || disabled) return;
        onSubmit(value.trim());
        setValue('');
      };

      const handleKeyDown = (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
          handleSubmit(e);
        }
      };

      return html`
        <div class="input-area">
          <form class="input-form" onSubmit=${handleSubmit}>
            <input
              ref=${inputRef}
              class="input-field"
              type="text"
              placeholder="send a message"
              value=${value}
              onInput=${e => setValue(e.target.value)}
              onKeyDown=${handleKeyDown}
              disabled=${disabled}
            />
            <button class="send-btn" type="submit" disabled=${disabled}>send</button>
          </form>
        </div>
      `;
    }

    // Main App
    function App() {
      const [status, setStatus] = useState('');
      const [statusText, setStatusText] = useState('connecting');
      const [messages, setMessages] = useState([]);
      const [tools, setTools] = useState({});
      const [permissions, setPermissions] = useState({});
      const [typing, setTyping] = useState(false);
      const [working, setWorking] = useState(false);
      const [vmContext, setVmContext] = useState({ vmId: null, parent: null, children: [], siblings: [] });
      const [sidebarOpen, setSidebarOpen] = useState(true);
      const [tree, setTree] = useState(null);
      const mainRef = useRef(null);
      const textAccum = useRef('');

      // Get current VM ID from hostname
      const currentVmId = window.location.hostname.split('.')[0];

      // Fetch VM context (parent/children/siblings)
      useEffect(() => {
        async function fetchContext() {
          try {
            const ctx = await rpc('vm/context');
            setVmContext({
              vmId: ctx.vmId,
              parent: ctx.parent,
              children: ctx.children || [],
              siblings: ctx.siblings || [],
            });
          } catch (e) {
            console.log('Could not fetch VM context:', e);
          }
        }
        fetchContext();

        // Refresh context periodically to catch new children
        const interval = setInterval(fetchContext, 10000);
        return () => clearInterval(interval);
      }, []);

      // Fetch full VM tree for sidebar
      useEffect(() => {
        async function fetchTree() {
          try {
            const result = await rpc('vm/list');
            const treeData = buildTreeFromVms(result.vms || [], currentVmId);
            setTree(treeData);
          } catch (e) {
            console.log('Could not fetch VM tree:', e);
          }
        }
        fetchTree();

        // Refresh tree periodically
        const interval = setInterval(fetchTree, 15000);
        return () => clearInterval(interval);
      }, [currentVmId]);

      // SSE connection for session events
      useEffect(() => {
        const eventsUrl = authToken ? `/events?token=${authToken}` : '/events';
        const es = new EventSource(eventsUrl);

        es.onopen = () => {
          setStatus('connected');
          setStatusText('connected');
        };

        es.onerror = () => {
          setStatus('error');
          setStatusText('disconnected');
        };

        es.addEventListener('notification', (e) => {
          const { type, data } = JSON.parse(e.data);
          handleNotification(type, data);
        });

        return () => es.close();
      }, []);

      // Stable child IDs for SSE subscription dependency
      const childIdsKey = vmContext.children.map(c => c.vmId).sort().join(',');

      // SSE connection for VM events (real-time children status)
      useEffect(() => {
        // Only subscribe if we have children to track
        if (!childIdsKey) return;

        const vmEventsUrl = authToken
          ? `/events/vms?vmIds=${childIdsKey}&token=${authToken}`
          : `/events/vms?vmIds=${childIdsKey}`;
        const vmEs = new EventSource(vmEventsUrl);

        vmEs.addEventListener('vm_event', (e) => {
          try {
            const event = JSON.parse(e.data);
            // Update child status if it's one of our children
            if (event.vmId && event.type) {
              setVmContext(ctx => ({
                ...ctx,
                children: ctx.children.map(child =>
                  child.vmId === event.vmId
                    ? { ...child, status: mapEventTypeToStatus(event.type, child.status, event) }
                    : child
                ),
              }));
            }
          } catch (err) {
            console.log('Error parsing vm_event:', err);
          }
        });

        vmEs.onerror = () => {
          console.log('VM events SSE error, will retry on reconnect');
        };

        return () => vmEs.close();
      }, [childIdsKey]);

      // SSE connection for ALL VM events (updates tree sidebar)
      useEffect(() => {
        if (!sidebarOpen) return; // Don't subscribe if sidebar is closed

        const allVmEventsUrl = authToken
          ? `/events/vms?token=${authToken}`
          : `/events/vms`;
        const allVmEs = new EventSource(allVmEventsUrl);

        allVmEs.addEventListener('vm_event', (e) => {
          try {
            const event = JSON.parse(e.data);
            // Update tree node status
            if (event.vmId && event.type) {
              setTree(currentTree => {
                if (!currentTree || !currentTree.nodeMap.has(event.vmId)) return currentTree;
                const node = currentTree.nodeMap.get(event.vmId);
                const newStatus = mapEventTypeToStatus(event.type, node.status, event);
                if (newStatus === node.status) return currentTree;

                // Update node in map
                const newNodeMap = new Map(currentTree.nodeMap);
                newNodeMap.set(event.vmId, { ...node, status: newStatus });

                // Update roots if needed
                const newRoots = currentTree.roots.map(function updateNode(n) {
                  if (n.vmId === event.vmId) {
                    return { ...n, status: newStatus, children: n.children.map(updateNode) };
                  }
                  return { ...n, children: n.children.map(updateNode) };
                });

                return { ...currentTree, roots: newRoots, nodeMap: newNodeMap };
              });
            }
          } catch (err) {
            console.log('Error updating tree from vm_event:', err);
          }
        });

        allVmEs.onerror = () => {
          console.log('All VM events SSE error');
        };

        return () => allVmEs.close();
      }, [sidebarOpen]);

      // Auto-scroll
      useEffect(() => {
        if (mainRef.current) {
          mainRef.current.scrollTop = mainRef.current.scrollHeight;
        }
      }, [messages, tools, typing]);

      function handleNotification(type, data) {
        switch (type) {
          case 'content_chunk':
            setTyping(false);
            setStatus('busy');
            setStatusText('generating');
            setWorking(true);
            textAccum.current += data.text || '';
            if (data.final && textAccum.current) {
              setMessages(m => [...m, { type: 'text', content: textAccum.current }]);
              textAccum.current = '';
            }
            break;

          case 'tool_call':
            setTyping(false);
            setStatus('busy');
            setStatusText(data.toolName || 'tool');
            setTools(t => ({
              ...t,
              [data.toolId || data.toolCallId]: {
                id: data.toolId || data.toolCallId,
                name: data.toolName,
                title: data.title,
                status: 'running',
                content: null,
              }
            }));
            break;

          case 'tool_result':
            const tid = data.toolId || data.toolCallId;
            setTools(t => ({
              ...t,
              [tid]: {
                ...t[tid],
                status: data.success !== false ? 'success' : 'error',
                content: typeof data.content === 'string'
                  ? data.content.slice(0, 1000)
                  : data.content ? JSON.stringify(data.content, null, 2).slice(0, 1000) : null,
              }
            }));
            break;

          case 'completed':
            setStatus('connected');
            setStatusText('connected');
            setWorking(false);
            setTyping(false);
            if (data.durationMs || data.inputTokens) {
              setMessages(m => [...m, { type: 'stats', data }]);
            }
            break;

          case 'failed':
            setStatus('connected');
            setStatusText('connected');
            setWorking(false);
            setTyping(false);
            setMessages(m => [...m, { type: 'error', content: data.error || 'unknown error' }]);
            break;

          case 'cancelled':
            setStatus('connected');
            setStatusText('connected');
            setWorking(false);
            setTyping(false);
            setMessages(m => [...m, { type: 'system', content: 'cancelled' }]);
            break;

          case 'permission_request':
            setTyping(false);
            setPermissions(p => ({
              ...p,
              [data.requestId]: data,
            }));
            break;
        }
      }

      async function handleSend(text) {
        setMessages(m => [...m, { type: 'user', content: text }]);
        setTyping(true);
        setStatus('busy');
        setStatusText('sending');

        try {
          await rpc('session/prompt', { text });
        } catch (e) {
          setTyping(false);
          setStatus('connected');
          setStatusText('connected');
          setMessages(m => [...m, { type: 'error', content: 'failed to send: ' + e.message }]);
        }
      }

      async function handlePermission(requestId, optionId) {
        setPermissions(p => {
          const { [requestId]: _, ...rest } = p;
          return rest;
        });

        try {
          await rpc('permission/respond', { requestId, optionId });
        } catch (e) {
          setMessages(m => [...m, { type: 'error', content: 'failed to respond: ' + e.message }]);
        }
      }

      async function handleBranch(e) {
        e.preventDefault();

        if (!vmContext.vmId) {
          setMessages(m => [...m, { type: 'error', content: 'cannot branch: not running in a VM' }]);
          return;
        }

        try {
          setMessages(m => [...m, { type: 'system', content: 'creating branch...' }]);
          const result = await rpc('vm/branch', { vmId: vmContext.vmId });
          setMessages(m => [...m, { type: 'system', content: `branch created: ${result.vmId}` }]);

          // Add the new child to context
          setVmContext(ctx => ({
            ...ctx,
            children: [...ctx.children, { vmId: result.vmId, status: 'starting' }],
          }));
        } catch (e) {
          setMessages(m => [...m, { type: 'error', content: 'failed to create branch: ' + e.message }]);
        }
      }

      const hasContent = messages.length > 0 || Object.keys(tools).length > 0 || typing;

      return html`
        <${Header}
          parent=${vmContext.parent}
          status=${status}
          statusText=${statusText}
          onThemeToggle=${cycleTheme}
          sidebarOpen=${sidebarOpen}
          onToggleSidebar=${() => setSidebarOpen(!sidebarOpen)}
        />

        <div class="split-container ${sidebarOpen ? '' : 'sidebar-closed'}">
          <${TreeSidebar} tree=${tree} currentVmId=${currentVmId} />

          <div class="shell-content">
            <main class="main" ref=${mainRef}>
              ${!hasContent && html`<${Empty} />`}

              ${messages.map((m, i) => {
                if (m.type === 'stats') {
                  return html`<${Stats} key=${i} data=${m.data} />`;
                }
                return html`<${Message} key=${i} type=${m.type} content=${m.content} />`;
              })}

              ${Object.values(tools).map(t => html`
                <${ToolBlock}
                  key=${t.id}
                  id=${t.id}
                  name=${t.name}
                  title=${t.title}
                  status=${t.status}
                  content=${t.content}
                />
              `)}

              ${Object.values(permissions).map(p => html`
                <${Permission}
                  key=${p.requestId}
                  id=${p.requestId}
                  toolCall=${p.toolCall}
                  options=${p.options}
                  onRespond=${handlePermission}
                />
              `)}

              ${typing && html`<${Typing} />`}
            </main>

            <${ChildrenBar}
              children=${vmContext.children}
              onBranch=${handleBranch}
            />

            <${InputArea}
              disabled=${working || status !== 'connected'}
              onSubmit=${handleSend}
            />
          </div>
        </div>
      `;
    }

    render(html`<${App} />`, document.getElementById('app'));
  </script>
</body>
</html>
