<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vers shell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --bg-elevated: #fafafa;
      --border: #002fff;
      --border-dim: #e0e0e0;
      --text: #002fff;
      --text-dim: #666666;
      --accent: #002fff;
      --accent-hover: #0040ff;
      --success: #00aa55;
      --error: #cc0000;
      --warning: #cc8800;
      --invert-text: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --bg-elevated: #0a0a0a;
        --border: #ffffff;
        --border-dim: #333333;
        --text: #d5d5d5;
        --text-dim: #888888;
        --accent: #f6d000;
        --accent-hover: #ffdd33;
        --success: #00ff88;
        --error: #ff4444;
        --warning: #ffaa00;
        --invert-text: #000000;
      }
    }

    html.light {
      --bg: #ffffff;
      --bg-elevated: #fafafa;
      --border: #002fff;
      --border-dim: #e0e0e0;
      --text: #002fff;
      --text-dim: #666666;
      --accent: #002fff;
      --accent-hover: #0040ff;
      --success: #00aa55;
      --error: #cc0000;
      --warning: #cc8800;
      --invert-text: #ffffff;
    }

    html.dark {
      --bg: #000000;
      --bg-elevated: #0a0a0a;
      --border: #ffffff;
      --border-dim: #333333;
      --text: #d5d5d5;
      --text-dim: #888888;
      --accent: #f6d000;
      --accent-hover: #ffdd33;
      --success: #00ff88;
      --error: #ff4444;
      --warning: #ffaa00;
      --invert-text: #000000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Share Tech Mono', monospace;
      font-size: 14px;
      line-height: 1.6;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      letter-spacing: 0.02em;
    }

    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--bg);
      flex-shrink: 0;
    }

    .logo {
      font-size: 14px;
      letter-spacing: 0.1em;
      color: var(--accent);
    }

    .parent-link {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: color 0.2s;
    }

    .parent-link:hover { color: var(--text); }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-dim);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: var(--text-dim);
    }

    .status-dot.connected { background: var(--success); }
    .status-dot.busy { background: var(--accent); animation: pulse 1.5s infinite; }
    .status-dot.error { background: var(--error); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-link {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 11px;
      transition: color 0.2s;
    }

    .header-link:hover { color: var(--text); }

    .theme-btn {
      background: none;
      border: 1px solid var(--border-dim);
      color: var(--text-dim);
      font-family: inherit;
      font-size: 10px;
      padding: 3px 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .theme-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    /* Main content */
    .main {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
    }

    .main::-webkit-scrollbar { width: 4px; }
    .main::-webkit-scrollbar-track { background: var(--bg); }
    .main::-webkit-scrollbar-thumb { background: var(--border-dim); }

    /* Messages */
    .message {
      margin-bottom: 14px;
      white-space: pre-wrap;
      word-wrap: break-word;
      animation: fadeIn 0.15s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-text { color: var(--text); }
    .message-system { color: var(--text-dim); font-size: 12px; }
    .message-user {
      color: var(--accent);
      padding-left: 14px;
      border-left: 2px solid var(--accent);
    }

    .message-error {
      color: var(--error);
      padding: 10px 14px;
      border: 1px solid var(--error);
    }

    /* Tool blocks */
    .tool-block {
      border: 1px solid var(--border-dim);
      margin: 14px 0;
    }

    .tool-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-dim);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
    }

    .tool-header.running { border-left: 2px solid var(--accent); }
    .tool-header.success { border-left: 2px solid var(--success); }
    .tool-header.error { border-left: 2px solid var(--error); }

    .tool-name { color: var(--text); }
    .tool-status { margin-left: auto; font-size: 10px; }

    .tool-content {
      padding: 10px 14px;
      font-size: 12px;
      color: var(--text-dim);
      max-height: 180px;
      overflow-y: auto;
    }

    /* Stats */
    .stats {
      display: flex;
      gap: 14px;
      padding: 10px 14px;
      border: 1px solid var(--border-dim);
      font-size: 11px;
      color: var(--text-dim);
      margin: 14px 0;
    }

    .stat { display: flex; gap: 5px; }
    .stat-value { color: var(--text); }

    /* Permission */
    .permission {
      border: 1px solid var(--warning);
      margin: 14px 0;
    }

    .permission-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--warning);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--warning);
    }

    .permission-content { padding: 14px; }
    .permission-tool { color: var(--text); margin-bottom: 12px; }
    .permission-actions { display: flex; gap: 10px; }

    .permission-btn {
      padding: 6px 14px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: 11px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }

    .permission-btn:hover {
      background: var(--text);
      color: var(--bg);
    }

    .permission-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--invert-text);
    }

    .permission-btn.primary:hover { background: var(--accent-hover); }

    /* Typing indicator */
    .typing {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-dim);
      font-size: 11px;
      margin: 14px 0;
    }

    .typing-dots { display: flex; gap: 3px; }

    .typing-dots span {
      width: 4px;
      height: 4px;
      background: var(--accent);
      animation: typing 1.4s infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing {
      0%, 60%, 100% { opacity: 0.3; }
      30% { opacity: 1; }
    }

    /* Empty state */
    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-dim);
      text-align: center;
    }

    .empty h2 {
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 0.1em;
      margin-bottom: 6px;
      color: var(--accent);
    }

    .empty p { font-size: 12px; }

    /* Children bar */
    .children-bar {
      border-top: 1px solid var(--border-dim);
      padding: 10px 24px;
      background: var(--bg-elevated);
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 11px;
      flex-shrink: 0;
    }

    .children-label { color: var(--text-dim); }

    .child-link {
      color: var(--text);
      text-decoration: none;
      padding: 3px 8px;
      border: 1px solid var(--border-dim);
      transition: all 0.2s;
    }

    .child-link:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .child-link.running { border-color: var(--accent); }
    .child-link.done { border-color: var(--success); }
    .child-link.failed { border-color: var(--error); }

    .branch-btn {
      color: var(--text-dim);
      text-decoration: none;
      padding: 3px 8px;
      border: 1px dashed var(--border-dim);
      transition: all 0.2s;
    }

    .branch-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      border-style: solid;
    }

    /* Input area */
    .input-area {
      border-top: 1px solid var(--border);
      padding: 14px 24px;
      background: var(--bg);
      flex-shrink: 0;
    }

    .input-form { display: flex; gap: 10px; }

    .input-field {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--border-dim);
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-field:focus { border-color: var(--accent); }
    .input-field:disabled { opacity: 0.5; }
    .input-field::placeholder { color: var(--text-dim); }

    .send-btn {
      padding: 10px 20px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: var(--invert-text);
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }

    .send-btn:hover { background: var(--accent-hover); }
    .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { h, render } from 'https://esm.sh/preact@10.19.3';
    import { useState, useEffect, useRef } from 'https://esm.sh/preact@10.19.3/hooks';
    import htm from 'https://esm.sh/htm@3.1.1';

    const html = htm.bind(h);

    // Get auth token from URL
    const urlParams = new URLSearchParams(window.location.search);
    const authToken = urlParams.get('token');

    // Theme management
    function getTheme() {
      return localStorage.getItem('vers-theme') || 'system';
    }

    function applyTheme(theme) {
      document.documentElement.classList.remove('light', 'dark');
      if (theme !== 'system') {
        document.documentElement.classList.add(theme);
      }
    }

    function cycleTheme() {
      const current = getTheme();
      const next = current === 'system' ? 'light' : current === 'light' ? 'dark' : 'system';
      localStorage.setItem('vers-theme', next);
      applyTheme(next);
      return next;
    }

    applyTheme(getTheme());

    // RPC helper
    async function rpc(method, params = {}) {
      const headers = { 'Content-Type': 'application/json' };
      if (authToken) headers['Authorization'] = `Bearer ${authToken}`;

      const res = await fetch('/rpc', {
        method: 'POST',
        headers,
        body: JSON.stringify({ jsonrpc: '2.0', id: Date.now(), method, params }),
      });

      const data = await res.json();
      if (data.error) throw new Error(data.error.message);
      return data.result;
    }

    // Escape HTML
    function esc(s) {
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    // Components
    function Header({ parent, status, statusText, onThemeToggle }) {
      const vmId = window.location.hostname.split('.')[0];
      const parentUrl = parent ? `https://${parent}.vm.vers.sh/shell` : null;

      return html`
        <header class="header">
          <span class="logo">vers shell</span>
          ${parentUrl && html`
            <a class="parent-link" href=${parentUrl} target="_blank">
              ← ${parent.slice(0, 8)}
            </a>
          `}
          <div class="status">
            <div class="status-dot ${status}"></div>
            <span>${statusText}</span>
          </div>
          <div class="header-right">
            <a class="header-link" href="/" target="_blank">app</a>
            <a class="header-link" href="/health" target="_blank">health</a>
            <button class="theme-btn" onClick=${onThemeToggle}>theme</button>
          </div>
        </header>
      `;
    }

    function ChildrenBar({ children, onBranch }) {
      if (!children || children.length === 0) {
        return html`
          <div class="children-bar">
            <span class="children-label">no children</span>
            <a class="branch-btn" href="#" onClick=${onBranch}>+ branch</a>
          </div>
        `;
      }

      return html`
        <div class="children-bar">
          <span class="children-label">children:</span>
          ${children.map(c => html`
            <a
              class="child-link ${c.status}"
              href="https://${c.vmId}.vm.vers.sh/shell"
              target="_blank"
            >
              ${c.vmId.slice(0, 8)} ${c.status === 'running' ? '◐' : c.status === 'done' ? '✓' : c.status === 'failed' ? '✗' : ''}
            </a>
          `)}
          <a class="branch-btn" href="#" onClick=${onBranch}>+ branch</a>
        </div>
      `;
    }

    function Message({ type, content }) {
      return html`<div class="message message-${type}">${content}</div>`;
    }

    function ToolBlock({ id, name, title, status, content }) {
      return html`
        <div class="tool-block">
          <div class="tool-header ${status}">
            <span class="tool-name">${name}</span>
            ${title && title !== name && html`<span>${esc(title)}</span>`}
            <span class="tool-status">${status === 'running' ? 'running' : status === 'success' ? 'done' : 'failed'}</span>
          </div>
          ${content && html`<div class="tool-content">${content}</div>`}
        </div>
      `;
    }

    function Stats({ data }) {
      const stats = [];
      if (data.durationMs) stats.push({ l: 'time', v: (data.durationMs / 1000).toFixed(1) + 's' });
      if (data.inputTokens) stats.push({ l: 'in', v: data.inputTokens.toLocaleString() });
      if (data.outputTokens) stats.push({ l: 'out', v: data.outputTokens.toLocaleString() });
      if (data.totalCostUsd) stats.push({ l: 'cost', v: '$' + data.totalCostUsd.toFixed(4) });

      if (stats.length === 0) return null;

      return html`
        <div class="stats">
          ${stats.map(s => html`
            <div class="stat">
              <span>${s.l}</span>
              <span class="stat-value">${s.v}</span>
            </div>
          `)}
        </div>
      `;
    }

    function Permission({ id, toolCall, options, onRespond }) {
      const opts = options || [
        { id: 'allow', label: 'allow' },
        { id: 'deny', label: 'deny' },
      ];

      return html`
        <div class="permission">
          <div class="permission-header">permission required</div>
          <div class="permission-content">
            ${toolCall && html`<div class="permission-tool">${esc(toolCall.title || toolCall.toolName)}</div>`}
            <div class="permission-actions">
              ${opts.map(o => html`
                <button
                  class="permission-btn ${o.id === 'allow' || o.id === 'yes' ? 'primary' : ''}"
                  onClick=${() => onRespond(id, o.id)}
                >
                  ${o.label.toLowerCase()}
                </button>
              `)}
            </div>
          </div>
        </div>
      `;
    }

    function Typing() {
      return html`
        <div class="typing">
          <div class="typing-dots">
            <span></span><span></span><span></span>
          </div>
          <span>working</span>
        </div>
      `;
    }

    function Empty() {
      return html`
        <div class="empty">
          <h2>vers shell</h2>
          <p>autonomous infrastructure for agents</p>
        </div>
      `;
    }

    function InputArea({ disabled, onSubmit }) {
      const [value, setValue] = useState('');
      const inputRef = useRef(null);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!value.trim() || disabled) return;
        onSubmit(value.trim());
        setValue('');
      };

      const handleKeyDown = (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
          handleSubmit(e);
        }
      };

      return html`
        <div class="input-area">
          <form class="input-form" onSubmit=${handleSubmit}>
            <input
              ref=${inputRef}
              class="input-field"
              type="text"
              placeholder="send a message"
              value=${value}
              onInput=${e => setValue(e.target.value)}
              onKeyDown=${handleKeyDown}
              disabled=${disabled}
            />
            <button class="send-btn" type="submit" disabled=${disabled}>send</button>
          </form>
        </div>
      `;
    }

    // Main App
    function App() {
      const [status, setStatus] = useState('');
      const [statusText, setStatusText] = useState('connecting');
      const [messages, setMessages] = useState([]);
      const [tools, setTools] = useState({});
      const [permissions, setPermissions] = useState({});
      const [typing, setTyping] = useState(false);
      const [working, setWorking] = useState(false);
      const [vmContext, setVmContext] = useState({ parent: null, children: [] });
      const mainRef = useRef(null);
      const textAccum = useRef('');

      // Fetch VM context (parent/children)
      useEffect(() => {
        async function fetchContext() {
          try {
            const list = await rpc('vm/list');
            // For now, mock the context - in real impl, vers API provides this
            // TODO: Get actual parent/children from vers metadata
            setVmContext({
              parent: list.currentVmId ? null : null, // Would come from vers
              children: [], // Would come from vers
            });
          } catch (e) {
            console.log('Could not fetch VM context:', e);
          }
        }
        fetchContext();
      }, []);

      // SSE connection
      useEffect(() => {
        const eventsUrl = authToken ? `/events?token=${authToken}` : '/events';
        const es = new EventSource(eventsUrl);

        es.onopen = () => {
          setStatus('connected');
          setStatusText('connected');
        };

        es.onerror = () => {
          setStatus('error');
          setStatusText('disconnected');
        };

        es.addEventListener('notification', (e) => {
          const { type, data } = JSON.parse(e.data);
          handleNotification(type, data);
        });

        return () => es.close();
      }, []);

      // Auto-scroll
      useEffect(() => {
        if (mainRef.current) {
          mainRef.current.scrollTop = mainRef.current.scrollHeight;
        }
      }, [messages, tools, typing]);

      function handleNotification(type, data) {
        switch (type) {
          case 'content_chunk':
            setTyping(false);
            setStatus('busy');
            setStatusText('generating');
            setWorking(true);
            textAccum.current += data.text || '';
            if (data.final && textAccum.current) {
              setMessages(m => [...m, { type: 'text', content: textAccum.current }]);
              textAccum.current = '';
            }
            break;

          case 'tool_call':
            setTyping(false);
            setStatus('busy');
            setStatusText(data.toolName || 'tool');
            setTools(t => ({
              ...t,
              [data.toolId || data.toolCallId]: {
                id: data.toolId || data.toolCallId,
                name: data.toolName,
                title: data.title,
                status: 'running',
                content: null,
              }
            }));
            break;

          case 'tool_result':
            const tid = data.toolId || data.toolCallId;
            setTools(t => ({
              ...t,
              [tid]: {
                ...t[tid],
                status: data.success !== false ? 'success' : 'error',
                content: typeof data.content === 'string'
                  ? data.content.slice(0, 1000)
                  : data.content ? JSON.stringify(data.content, null, 2).slice(0, 1000) : null,
              }
            }));
            break;

          case 'completed':
            setStatus('connected');
            setStatusText('connected');
            setWorking(false);
            setTyping(false);
            if (data.durationMs || data.inputTokens) {
              setMessages(m => [...m, { type: 'stats', data }]);
            }
            break;

          case 'failed':
            setStatus('connected');
            setStatusText('connected');
            setWorking(false);
            setTyping(false);
            setMessages(m => [...m, { type: 'error', content: data.error || 'unknown error' }]);
            break;

          case 'cancelled':
            setStatus('connected');
            setStatusText('connected');
            setWorking(false);
            setTyping(false);
            setMessages(m => [...m, { type: 'system', content: 'cancelled' }]);
            break;

          case 'permission_request':
            setTyping(false);
            setPermissions(p => ({
              ...p,
              [data.requestId]: data,
            }));
            break;
        }
      }

      async function handleSend(text) {
        setMessages(m => [...m, { type: 'user', content: text }]);
        setTyping(true);
        setStatus('busy');
        setStatusText('sending');

        try {
          await rpc('session/prompt', { text });
        } catch (e) {
          setTyping(false);
          setStatus('connected');
          setStatusText('connected');
          setMessages(m => [...m, { type: 'error', content: 'failed to send: ' + e.message }]);
        }
      }

      async function handlePermission(requestId, optionId) {
        setPermissions(p => {
          const { [requestId]: _, ...rest } = p;
          return rest;
        });

        try {
          await rpc('permission/respond', { requestId, optionId });
        } catch (e) {
          setMessages(m => [...m, { type: 'error', content: 'failed to respond: ' + e.message }]);
        }
      }

      function handleBranch(e) {
        e.preventDefault();
        // TODO: Implement branch creation via vers API
        setMessages(m => [...m, { type: 'system', content: 'branch creation coming soon' }]);
      }

      const hasContent = messages.length > 0 || Object.keys(tools).length > 0 || typing;

      return html`
        <${Header}
          parent=${vmContext.parent}
          status=${status}
          statusText=${statusText}
          onThemeToggle=${cycleTheme}
        />

        <main class="main" ref=${mainRef}>
          ${!hasContent && html`<${Empty} />`}

          ${messages.map((m, i) => {
            if (m.type === 'stats') {
              return html`<${Stats} key=${i} data=${m.data} />`;
            }
            return html`<${Message} key=${i} type=${m.type} content=${m.content} />`;
          })}

          ${Object.values(tools).map(t => html`
            <${ToolBlock}
              key=${t.id}
              id=${t.id}
              name=${t.name}
              title=${t.title}
              status=${t.status}
              content=${t.content}
            />
          `)}

          ${Object.values(permissions).map(p => html`
            <${Permission}
              key=${p.requestId}
              id=${p.requestId}
              toolCall=${p.toolCall}
              options=${p.options}
              onRespond=${handlePermission}
            />
          `)}

          ${typing && html`<${Typing} />`}
        </main>

        <${ChildrenBar}
          children=${vmContext.children}
          onBranch=${handleBranch}
        />

        <${InputArea}
          disabled=${working || status !== 'connected'}
          onSubmit=${handleSend}
        />
      `;
    }

    render(html`<${App} />`, document.getElementById('app'));
  </script>
</body>
</html>
